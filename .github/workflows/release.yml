name: Release

# Releases are automatic: every push to main reads version.inc, and if no
# tag vX.Y.Z exists yet, builds everything and publishes release vX.Y.Z.
# To ship a release: bump version.inc and add its CHANGELOG.md section.
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'
      replace_existing:
        description: 'Replace the assets of a release that already exists'
        type: boolean
        required: false
        default: false

# Build jobs only read the repository. The publish job alone gets a write
# token, and it runs nothing but shell and the release action.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      previous: ${{ steps.ver.outputs.previous }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version and tag state
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REPLACE_EXISTING: ${{ github.event.inputs.replace_existing }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag names and dispatch input are attacker-shaped text. They reach
          # this script only through the environment, and nothing below uses
          # V before it has matched a plain X.Y.Z.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            V="$REF_NAME"
          else
            V="$(make -s version)"
          fi
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version is not X.Y.Z (got a value of ${#V} characters)."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "v$V is already released; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Releasing v$V."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # A manual run or a pushed tag must not silently rewrite a release
            # that users already have (assets and SHA256SUMS would change).
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
               && [ "$REPLACE_EXISTING" != "true" ]; then
              echo "::error::Release v$V already exists. Re-run manually with replace_existing set to replace its assets."
              exit 1
            fi
            echo "Releasing v$V."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          # Newest earlier v* tag, for the "full changelog" link
          prev="$(git tag -l 'v*' --sort=-v:refname | grep -vx "v$V" | head -1 || true)"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

      - name: Release notes exist in CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash packaging/release-notes.sh "$VERSION" > /dev/null

  linux:
    name: Linux artifacts (tarball / deb / AppImage)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.release == 'true'
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Derive version
        id: ver
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm dpkg-dev rpm zip file desktop-file-utils

      - name: Check tag matches version.inc
        run: |
          src="$(make -s version)"
          if [ "$src" != "$APP_VERSION" ]; then
            echo "::error::Tag version $APP_VERSION does not match version.inc ($src). Bump version.inc first."
            exit 1
          fi

      - name: Build binary
        run: |
          make clean
          make
          mkdir -p dist
          # Bare binary: what the in-terminal 'update install' downloads
          cp terminal dist/asm-terminal-linux-x86_64

      - name: Run smoke tests
        run: bash tests/run_tests.sh

      - name: Build tarball
        run: VERSION="$APP_VERSION" make dist

      - name: Build .deb
        run: make deb

      - name: Build .rpm
        run: make rpm

      - name: Desktop files + install script (for install.sh one-liner)
        run: |
          make desktop-tarball
          cp packaging/linux/install-release.sh dist/install.sh

      - name: Build AppImage
        run: make appimage

      # upload-artifact only complains when nothing at all matches, so check
      # each file the updater and the install script download by name.
      - name: Check every Linux asset exists
        run: |
          ls -la dist/ asm-terminal-*.AppImage
          for f in \
              "dist/asm-terminal-linux-x86_64" \
              "dist/install.sh" \
              "dist/asm-terminal-linux-desktop.tar.gz" \
              "dist/asm-terminal-$APP_VERSION-linux-x86_64.tar.gz" \
              "dist/asm-terminal_${APP_VERSION}_amd64.deb" \
              "dist/asm-terminal-$APP_VERSION-1.x86_64.rpm" \
              "asm-terminal-$APP_VERSION-x86_64.AppImage"; do
            [ -s "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/asm-terminal-linux-x86_64
            dist/asm-terminal-linux-desktop.tar.gz
            dist/install.sh
            asm-terminal-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows artifacts (exe + NSIS setup.exe)
    runs-on: windows-latest
    outputs:
      version: ${{ needs.linux.outputs.version }}
    needs: linux
    env:
      VERSION: ${{ needs.linux.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install NASM (chocolatey)
        shell: pwsh
        run: |
          choco install -y nasm --no-progress
          # choco installs to "C:\Program Files\NASM" on GH runners
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"

      - name: Install MinGW-w64 (chocolatey)
        shell: pwsh
        run: |
          choco install -y mingw --no-progress
          # Locate the real MinGW install dir and pin ld.exe to it; other
          # toolchains on the runner (e.g. Strawberry Perl) ship an ld.exe
          # that doesn't know about Windows import libs, so PATH order alone
          # is unsafe. Store explicit paths as env vars for build.bat.
          $candidates = @(
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\ld.exe',
            'C:\ProgramData\mingw64\mingw64\bin\ld.exe',
            'C:\tools\mingw64\bin\ld.exe',
            'C:\msys64\mingw64\bin\ld.exe'
          )
          $ldExe = $null
          foreach ($c in $candidates) { if (Test-Path $c) { $ldExe = $c; break } }
          if (-not $ldExe) {
              $ldExe = (Get-ChildItem 'C:\ProgramData\chocolatey\lib\mingw' -Recurse -Filter ld.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $ldExe) { throw 'MinGW ld.exe not found after install.' }
          $ldDir = Split-Path $ldExe -Parent
          $ldLib = Join-Path (Split-Path $ldDir -Parent) 'x86_64-w64-mingw32\lib'
          if (-not (Test-Path $ldLib)) { $ldLib = Join-Path (Split-Path $ldDir -Parent) 'lib' }
          Write-Host "MinGW ld.exe = $ldExe"
          Write-Host "MinGW libdir = $ldLib"
          # Prepend to PATH and export for build.bat
          Add-Content -Path $env:GITHUB_PATH -Value $ldDir
          "LD_EXE=$ldExe"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LD_LIBDIR=$ldLib"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NSIS (chocolatey)
        shell: pwsh
        run: |
          choco install -y nsis --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Verify toolchain
        shell: pwsh
        run: |
          nasm -v
          Write-Host "LD_EXE    = $env:LD_EXE"
          Write-Host "LD_LIBDIR = $env:LD_LIBDIR"
          & $env:LD_EXE --version | Select-Object -First 1
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION

      - name: Build terminal.exe
        shell: cmd
        run: |
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Stage Windows zip payload
        shell: pwsh
        run: |
          $v    = $env:VERSION
          $name = "asm-terminal-$v-windows-x86_64"
          $dst  = "dist\$name"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item terminal.exe                                     "$dst\"
          Copy-Item packaging\windows\install.bat                    "$dst\"
          Copy-Item packaging\windows\install.ps1                    "$dst\"
          # The scripts carry a version for Add/Remove Programs; stamp the
          # release version in so it never shows a stale one.
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $stamps = @(
              @{ File = "$dst\install.bat"; Pattern = '(?m)^(set "APP_VERSION=)[^"]*(")' },
              @{ File = "$dst\install.ps1"; Pattern = "(?m)^(\`$AppVersion\s*=\s*')[^']*(')" }
          )
          foreach ($s in $stamps) {
              $path = (Resolve-Path $s.File).Path
              $text = [System.IO.File]::ReadAllText($path)
              if ($text -notmatch $s.Pattern) { Write-Warning "no version line found in $($s.File)"; continue }
              $text = [regex]::Replace($text, $s.Pattern, ('${1}' + $v + '${2}'))
              [System.IO.File]::WriteAllText($path, $text, $utf8)
          }
          Copy-Item packaging\windows\uninstall.bat                  "$dst\"
          if (Test-Path packaging\windows\asm-terminal.ico) {
              Copy-Item packaging\windows\asm-terminal.ico          "$dst\"
          }
          Copy-Item README.md                                        "$dst\"
          Copy-Item packaging\windows\README.md                      "$dst\INSTALL.md"
          Copy-Item LICENSE                                          "$dst\"
          Compress-Archive -Path "$dst\*" -DestinationPath "dist\$name.zip" -Force
          Copy-Item terminal.exe "dist\asm-terminal-windows-x86_64.exe"
          Get-ChildItem dist

      - name: Build NSIS setup.exe
        shell: pwsh
        run: |
          $v = $env:VERSION
          # NSIS File directives look relative to the .nsi location.
          Copy-Item terminal.exe                 packaging\windows\terminal.exe -Force
          Push-Location packaging\windows
          try {
              & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPP_VERSION=$v installer.nsi
          } finally {
              Pop-Location
          }
          $out = Get-ChildItem packaging\windows\asm-terminal-*-setup.exe | Select-Object -First 1
          if ($out) {
              Move-Item $out.FullName dist\ -Force
              Write-Host "Built: $(Join-Path dist $out.Name)"
          } else {
              Write-Error "makensis did not produce a setup.exe"
          }

      # ---- OPTIONAL signing steps (run only when the corresponding secret exists) ----

      # ---- Optional code-signing (runs only when a PFX secret is set) --------
      # `secrets.*` cannot be referenced in step-level `if:` expressions, so
      # we import the secret into env first and then the signing step checks
      # env.CODE_SIGN_PFX_BASE64 internally, skipping gracefully when empty.
      # For Azure Trusted Signing, see packaging/windows/SIGNING.md.
      - name: Sign setup.exe with PFX (no-op if secret unset)
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64:   ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODE_SIGN_PFX_BASE64) {
              Write-Host 'CODE_SIGN_PFX_BASE64 not set, shipping unsigned binaries.'
              exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem dist\*setup.exe | ForEach-Object {
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:CODE_SIGN_PFX_PASSWORD $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
              & $signtool verify /pa /all $_.FullName
          }
          Remove-Item $pfxPath -Force

      - name: Check every Windows asset exists
        shell: pwsh
        run: |
          foreach ($f in @(
              "dist\asm-terminal-$env:VERSION-windows-x86_64.zip",
              "dist\asm-terminal-$env:VERSION-windows-x86_64-setup.exe",
              "dist\asm-terminal-windows-x86_64.exe")) {
              if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "missing release asset $f" }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            dist/asm-terminal-*-windows-x86_64.zip
            dist/asm-terminal-*-setup.exe
            dist/asm-terminal-windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [check, linux, windows]
    # A manual run from a feature branch still builds and tests everything
    # (a dry run) but never publishes: a release becomes "latest", which is
    # what every installed terminal updates to.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PREVIOUS: ${{ needs.check.outputs.previous }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p final
          find release-assets -type f -exec cp -v {} final/ \;
          # Never publish a release that lacks something an installer fetches
          for f in asm-terminal-linux-x86_64 install.sh asm-terminal-linux-desktop.tar.gz \
                   "asm-terminal-$VERSION-linux-x86_64.tar.gz" \
                   "asm-terminal_${VERSION}_amd64.deb" "asm-terminal-$VERSION-1.x86_64.rpm" \
                   "asm-terminal-$VERSION-x86_64.AppImage" \
                   "asm-terminal-$VERSION-windows-x86_64.zip" \
                   "asm-terminal-$VERSION-windows-x86_64-setup.exe" \
                   asm-terminal-windows-x86_64.exe; do
            [ -s "final/$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          # Checksums for every asset; 'update install' verifies against this
          (cd final && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ls -la final/

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          bash packaging/release-notes.sh "$VERSION" final/SHA256SUMS "$PREVIOUS" > release-notes.md
          cat release-notes.md

      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ASM Terminal ${{ needs.check.outputs.version }}
          body_path: release-notes.md
          files: final/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
