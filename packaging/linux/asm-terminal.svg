<?xml version="1.0" encoding="UTF-8"?>
<!-- ASM Terminal app icon. Pure shapes, no fonts, so it renders the same everywhere. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a24"/>
      <stop offset="1" stop-color="#06140f"/>
    </linearGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="86" y1="96" x2="172" y2="162">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="128" cy="128" r="104" fill="url(#halo)"/>

  <!-- CPU pins -->
  <g stroke="#22c55e" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round">
    <path d="M96 40v20M128 40v20M160 40v20"/>
    <path d="M96 196v20M128 196v20M160 196v20"/>
    <path d="M40 96h20M40 128h20M40 160h20"/>
    <path d="M196 96h20M196 128h20M196 160h20"/>
  </g>

  <!-- Chip body -->
  <rect x="60" y="60" width="136" height="136" rx="22" fill="url(#chip)" stroke="#22c55e" stroke-width="5"/>
  <circle cx="80" cy="80" r="5" fill="#22c55e" fill-opacity="0.6"/>

  <!-- Prompt: >_ -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 98l32 30-32 30"/>
    <path d="M132 158h40"/>
  </g>
</svg>
